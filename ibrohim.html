
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STYLEX — Fashion Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f7;
    color:#111;
    transition:.3s;
}

body.dark{
    background:#111;
    color:white;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    padding:18px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 20px #00000012;
}

.dark header{
    background:#1b1b1b;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff4d00;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:inherit;
    font-weight:600;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.header-buttons button{
    border:0;
    background:#eee;
    padding:11px 15px;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
}

.dark .header-buttons button{
    background:#333;
    color:white;
}

.hero{
    min-height:500px;
    padding:70px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(120deg,#111,#333);
    color:white;
}

.hero-text{
    max-width:550px;
}

.hero h1{
    font-size:65px;
    line-height:1;
    margin-bottom:25px;
}

.hero h1 span{
    color:#ff4d00;
}

.hero p{
    color:#ccc;
    font-size:18px;
    margin-bottom:30px;
}

.hero button{
    padding:15px 30px;
    border:0;
    border-radius:30px;
    background:#ff4d00;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.hero-image{
    width:430px;
    height:430px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 70px #ff4d0044;
}

.hero-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.search-box{
    padding:35px 7% 15px;
}

.search{
    width:100%;
    padding:17px 22px;
    border:2px solid #ddd;
    border-radius:15px;
    outline:none;
    font-size:16px;
}

.dark .search{
    background:#222;
    color:white;
    border-color:#444;
}

.categories{
    padding:20px 7%;
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.categories button{
    border:0;
    padding:12px 20px;
    border-radius:30px;
    cursor:pointer;
    background:#fff;
    white-space:nowrap;
}

.categories button.active,
.categories button:hover{
    background:#ff4d00;
    color:white;
}

.dark .categories button{
    background:#222;
    color:white;
}

.products{
    padding:25px 7% 70px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    transition:.3s;
    box-shadow:0 5px 20px #00000010;
}

.dark .card{
    background:#1c1c1c;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px #00000020;
}

.card img{
    width:100%;
    height:280px;
    object-fit:cover;
}

.card-info{
    padding:18px;
}

.card-info h3{
    margin-bottom:8px;
}

.category{
    color:#888;
    font-size:13px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin:12px 0;
}

.card button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    cursor:pointer;
}

.card button:hover{
    background:#ff4d00;
}

.favorite{
    position:absolute;
    top:12px;
    right:12px;
    width:40px !important;
    height:40px;
    border-radius:50% !important;
    background:white !important;
    color:#111 !important;
    font-size:18px;
}

footer{
    padding:40px 7%;
    background:#111;
    color:white;
    text-align:center;
}

.cart{
    position:fixed;
    right:-420px;
    top:0;
    width:380px;
    height:100%;
    background:white;
    z-index:200;
    padding:25px;
    transition:.4s;
    box-shadow:-10px 0 30px #0003;
}

.dark .cart{
    background:#1c1c1c;
}

.cart.open{
    right:0;
}

.cart h2{
    margin-bottom:25px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.close{
    position:absolute;
    right:20px;
    top:15px;
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
}

@media(max-width:1000px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .hero-image{
        width:330px;
        height:330px;
    }
}

@media(max-width:750px){
    nav{
        display:none;
    }

    .hero{
        flex-direction:column;
        text-align:center;
        gap:40px;
    }

    .hero h1{
        font-size:45px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .hero-image{
        width:280px;
        height:280px;
    }
}

@media(max-width:500px){
    .products{
        grid-template-columns:1fr;
    }

    .cart{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">STYLE<span>X</span></div>

    <nav>
        <a href="#">Bosh sahifa</a>
        <a href="#products">Kiyimlar</a>
        <a href="#">Yangi</a>
    </nav>

    <div class="header-buttons">

        </p>
        <button onclick="document.getElementById('products').scrollIntoView()">
            Kiyimlarni ko'rish →

    <div class="hero-image">

</section>

<div class="search-box">
    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 Kiyim qidiring... masalan: futbolka, shim, kurtka"
        oninput="searchProducts()"
    >
</div>

<div class="categories">
    <button class="active" onclick="filterProducts('all',this)">Barchasi</button>
    <button onclick="filterProducts('Futbolka',this)">👕 Futbolka</button>
    <button onclick="filterProducts('Ko‘ylak',this)">👔 Ko‘ylak</button>
    <button onclick="filterProducts('Shim',this)">👖 Shim</button>
    <button onclick="filterProducts('Kurtka',this)">🧥 Kurtka</button>
    <button onclick="filterProducts('Sviter',this)">🧶 Sviter</button>
    <button onclick="filterProducts('Ko‘ylaklar',this)">👗 Ayollar</button>
    <button onclick="filterProducts('Oyoq kiyim',this)">👟 Oyoq kiyim</button>
    <button onclick="filterProducts('Aksessuar',this)">🧢 Aksessuar</button>
</div>

<section class="products" id="products"></section>

<div class="cart" id="cart">
    <button class="close" onclick="closeCart()">×</button>
    <h2>🛒 Savatcha</h2>
    <div id="cartItems"></div>
    <h3 id="total">Jami: 0 so'm</h3>
</div>

<footer>
    <h2>STYLEX</h2>
    <p>© 2026 STYLEX — Fashion Store</p>
</footer>

["Sport Bag","Aksessuar",219000,"https://images.unsplash.com/photo-1553062407-98eeb64c6a62"]

];

let cart = [];

function showProducts(list=products){

    const container=document.getElementById("products");

    container.innerHTML="";

    list.forEach((p,index)=>{

        container.innerHTML+=`

        <div class="card">

            <button class="favorite" onclick="favorite(this)">♡</button>

            <img src="${p[3]}?auto=format&fit=crop&w=600&q=80">

            <div class="card-info">

                <div class="category">${p[1]}</div>

                <h3>${p[0]}</h3>

                <div class="price">${p[2].toLocaleString()} so'm</div>

                <button onclick="addCart(${index})">
                    🛒 Savatga qo'shish
                </button>

            </div>

        </div>

        `;

    });

}

function addCart(index){

    cart.push(products[index]);

    document.getElementById("cartCount").innerText=cart.length;

    updateCart();

    document.getElementById("cart").classList.add("open");

}

function updateCart(){

    const box=document.getElementById("cartItems");

    box.innerHTML="";

    let total=0;

    cart.forEach((item,index)=>{

        total+=item[2];

        box.innerHTML+=`

        <div class="cart-item">

            <span>${item[0]}</span>

            <b>${item[2].toLocaleString()} so'm</b>

            <button onclick="removeCart(${index})">×</button>

        </div>

        `;

    });

    document.getElementById("total").innerText=
    "Jami: "+total.toLocaleString()+" so'm";

}

function removeCart(index){

    cart.splice(index,1);

    document.getElementById("cartCount").innerText=cart.length;

    updateCart();

}

function openCart(){
    document.getElementById("cart").classList.add("open");
}

function closeCart(){
    document.getElementById("cart").classList.remove("open");
}

function favorite(btn){

    if(btn.innerText==="♡"){
        btn.innerText="♥";
        btn.style.color="red";
    }else{
        btn.innerText="♡";
        btn.style.color="#111";
    }

}

function darkMode(){

    document.body.classList.toggle("dark");

}

function filterProducts(category,btn){

    document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    if(category==="all"){
        showProducts();
    }else{
        showProducts(products.filter(p=>p[1]===category));
    }

}

function searchProducts(){

    const value=document
        .getElementById("search")
        .value
        .toLowerCase();

    const result=products.filter(p=>
        p[0].toLowerCase().includes(value) ||
        p[1].toLowerCase().includes(value)
    );

    showProducts(result);

}

showProducts();

</script>
